              ? stored
              : prefersDark
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);

            meta.setAttribute(
              "content",
              theme === "dark" ? "rgb(15, 65, 105)" : "rgb(108, 161, 205)"
            );
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
